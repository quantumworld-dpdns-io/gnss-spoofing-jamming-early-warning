name: Robot Framework Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  robot-ci:
    name: Robot Framework CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [acceptance, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install robotframework robotframework-requestslibrary \
            robotframework-seleniumlibrary robotframework-databaselibrary \
            robotframework-pabot
      - name: Start test server
        run: |
          cargo run -p mcp-server &
          sleep 2
          echo "Test server started"
      - name: Run ${{ matrix.suite }} tests
        run: |
          mkdir -p tests/robot/results/${{ matrix.suite }}
          robot --outputdir tests/robot/results/${{ matrix.suite }} \
            tests/robot/${{ matrix.suite }}/
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-${{ matrix.suite }}
          path: tests/robot/results/${{ matrix.suite }}/
