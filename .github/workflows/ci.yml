name: CI
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  GO_VERSION: "1.23"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python lint tools
        run: pip install ruff mypy
      - name: Install Go lint tools
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Lint Rust
        run: cargo clippy --workspace -- -D warnings && cargo fmt --check
      - name: Lint Python
        run: ruff check src/detection-engine/python/ tests/
      - name: Typecheck Python
        run: mypy src/detection-engine/python/ --strict || true
      - name: Lint Go
        run: cd src/api-gateway && go vet ./...
      - name: Lint YAML workflows
        uses: docker://rhysd/actionlint:latest

  test:
    name: Test Suite
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [rust, python, go]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.component == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - if: matrix.component == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - if: matrix.component == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run ${{ matrix.component }} tests
        run: make test-${{ matrix.component }}

  robot-tests:
    name: Robot Framework Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Robot Framework
        run: |
          pip install robotframework robotframework-requestslibrary \
            robotframework-seleniumlibrary robotframework-databaselibrary
      - name: Run acceptance tests
        run: make test-robot-acceptance
      - name: Run security tests
        run: make test-robot-security
      - name: Upload Robot results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: tests/robot/results/

  security:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Rust dependency audit
        run: cargo audit
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  build:
    name: Build & Package
    needs: [test, robot-tests, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build all
        run: make build
      - name: Build Docker images
        run: make docker-build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/release/
            bin/
            .next/

  quantum:
    name: Quantum Validation
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install quantum dependencies
        run: |
          pip install numpy scipy qiskit qiskit-machine-learning pennylane
      - name: Run quantum tests
        run: make quantum

  fuzz:
    name: Fuzz Testing
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz tests
        run: make fuzz
        continue-on-error: true
