name: Infra

on:
  push:
    paths:
      - "deploy/**"
      - "src/alert-ingest/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "src/alert-ingest/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cost-guard:
    name: Terraform validate + deny-paid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz \
            | tar xz
          sudo mv conftest /usr/local/bin/
      - name: Cost guard (no apply)
        run: bash deploy/scripts/cost-guard.sh
      - name: Ingest unit tests
        run: |
          python3 -m pip install pytest
          python3 -m pytest src/alert-ingest/handler_test.py -v -o addopts=
