apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gnss-detection
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/quantumworld-dpdns-io/gnss-spoofing-jamming-early-warning
    targetRevision: HEAD
    path: deploy/helm/gnss-detection
    helm:
      valueFiles:
        - values-{{ .Values.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gnss-detection
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
