skills:
  - name: gnss-analyst
    path: ./gnss-analyst/skill.yaml
    enabled: true
    priority: 10
  - name: quantum-verifier
    path: ./quantum-verifier/skill.yaml
    enabled: true
    priority: 20
  - name: alert-dispatcher
    path: ./alert-dispatcher/skill.yaml
    enabled: true
