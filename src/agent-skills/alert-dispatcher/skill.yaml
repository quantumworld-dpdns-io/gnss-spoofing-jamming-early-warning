name: alert-dispatcher
version: 0.1.0
description: >
  Manages alert generation, deduplication, and multi-channel
  notification dispatch (Slack, Email, Webhook, SMS).

tools:
  - gnss_get_alerts
  - gnss_acknowledge_alert
  - notification_send

triggers:
  - event: spoofing.detected
    action: dispatch_alert
  - event: alert.escalated
    action: notify_oncall

channels:
  - type: slack
    enabled: true
  - type: email
    enabled: true
  - type: webhook
    enabled: true
  - type: sms
    enabled: false

config:
  dedup_window_secs: 300
  escalation_timeout_min: 15
  max_alerts_per_minute: 10
  critical_alert_ttl_hours: 24

permissions:
  - read:alerts
  - write:alerts
  - send:notifications
